name: Instagram Automation

on:
  schedule:
    - cron: '0 11 * * *'  # 8h BRT (UTC-3)
  workflow_dispatch:       # permite rodar manualmente pelo GitHub

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache do fingerprint do instagrapi
        # ponytail: sem isso, toda execução pareceria um "login do zero" pro Instagram —
        # o cache guarda o mesmo dispositivo virtual entre execuções.
        uses: actions/cache@v4
        with:
          path: ig-saves-engine/.instagrapi_settings.json
          key: instagrapi-settings-v1

      - name: Instalar dependências
        run: pip install -r ig-saves-engine/requirements.txt

      - name: Sincronizar posts do Instagram
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_SAVES: ${{ secrets.NOTION_DB_SAVES }}
          INSTAGRAM_SESSIONID: ${{ secrets.INSTAGRAM_SESSIONID }}
        run: python ig-saves-engine/instagram_saves_sync.py

      - name: Gerar roteiros no tom Neovertix (Gemini)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_SAVES: ${{ secrets.NOTION_DB_SAVES }}
          NOTION_DB_IDEAS: ${{ secrets.NOTION_DB_IDEAS }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python ig-saves-engine/generate_ideas.py

      # Etapa de postagem automática desativada a pedido do usuário (2026-06-22).
      # Ideias continuam sendo geradas e salvas no Notion com status pendente de aprovação;
      # a postagem real fica manual até reativação explícita.
      # - name: Postar ideias aprovadas no Instagram
      #   env:
      #     NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      #     NOTION_DB_IDEAS: ${{ secrets.NOTION_DB_IDEAS }}
      #     INSTAGRAM_SESSIONID: ${{ secrets.INSTAGRAM_SESSIONID }}
      #     INSTAGRAM_CSRFTOKEN: ${{ secrets.INSTAGRAM_CSRFTOKEN }}
      #     INSTAGRAM_DS_USER_ID: ${{ secrets.INSTAGRAM_DS_USER_ID }}
      #   run: python ig-saves-engine/post_to_instagram.py
